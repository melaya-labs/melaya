import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'java-library'
    id 'application'
    id 'com.vanniktech.maven.publish' version '0.30.0'
}

group = 'org.melaya'
version = '0.5.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // JsonNode appears in every public SDK signature → api (compile) scope
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    // WebSocketClient is only used in private fields → implementation is correct
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
}

application {
    mainClass = 'org.melaya.E2E'
}

jar {
    from('LICENSE') {
        into 'META-INF'
    }
}

// e2e smoke lives under e2e/ (separate source set; uses the main library output + deps)
// unittest is the same pattern: no test framework dependency (no new deps) — a
// mock-transport suite (embedded com.sun.net.httpserver.HttpServer, JDK-only)
// run as a plain main() via its own JavaExec task, exiting non-zero on failure.
sourceSets {
    e2e {
        java.srcDirs = ['e2e']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    unittest {
        java.srcDirs = ['unittest']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    e2eImplementation.extendsFrom implementation
    e2eRuntimeOnly.extendsFrom runtimeOnly
    unittestImplementation.extendsFrom implementation
    unittestRuntimeOnly.extendsFrom runtimeOnly
}
tasks.named('run', JavaExec) {
    classpath = sourceSets.e2e.runtimeClasspath
    mainClass = 'org.melaya.E2E'
}
tasks.register('unitTest', JavaExec) {
    group = 'verification'
    description = 'Mock-transport unit tests (no network, no API key required).'
    classpath = sourceSets.unittest.runtimeClasspath
    mainClass = 'org.melaya.UnitTests'
}
tasks.named('test') {
    dependsOn 'unitTest'
}

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()
    coordinates('org.melaya', 'melaya-sdk', version)
    pom {
        name = 'Melaya Java'
        description = 'Official SDK for Melaya Agent Builder and Mobile Device Control. Includes preview Melaya Trading namespaces that are not yet generally available.'
        url = 'https://melaya.org'
        licenses { license { name = 'Apache-2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0' } }
        developers { developer { id = 'melaya-labs'; name = 'Melaya'; email = 'info@melaya.org' } }
        scm {
            url = 'https://github.com/melaya-labs/melaya'
            connection = 'scm:git:https://github.com/melaya-labs/melaya.git'
            developerConnection = 'scm:git:ssh://git@github.com/melaya-labs/melaya.git'
        }
    }
}

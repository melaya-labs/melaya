import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'java-library'
    id 'application'
    id 'com.vanniktech.maven.publish' version '0.30.0'
}
group = 'org.melaya'
version = '0.2.0'
repositories { mavenCentral() }
dependencies {
    // 'api' (not 'implementation'): both appear in public signatures —
    // JSONObject/JSONArray return types and OkHttpClient in the MelayaStream constructor.
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'org.json:json:20240303'
}
application { mainClass = 'org.melaya.E2EKt' }
kotlin { jvmToolchain(21) }

tasks.named('jar') {
    from('LICENSE') {
        into 'META-INF'
    }
}

// e2e smoke lives under e2e/ (separate source set; uses the main library output + deps)
sourceSets {
    e2e {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
kotlin.sourceSets.e2e.kotlin.srcDirs = ['e2e']
configurations {
    e2eImplementation.extendsFrom implementation, api
    e2eRuntimeOnly.extendsFrom runtimeOnly
}
tasks.named('run', JavaExec) {
    classpath = sourceSets.e2e.runtimeClasspath
    mainClass = 'org.melaya.E2EKt'
}

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()
    coordinates('org.melaya', 'melaya-sdk-kotlin', version)
    pom {
        name = 'Melaya Kotlin SDK'
        description = 'Official SDK for Melaya Agent Builder and Mobile Device Control. Includes preview Melaya Trading namespaces that are not yet generally available.'
        url = 'https://melaya.org'
        licenses { license { name = 'Apache-2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0' } }
        developers { developer { id = 'melaya-labs'; name = 'Melaya'; email = 'info@melaya.org' } }
        scm {
            url = 'https://github.com/melaya-labs/melaya'
            connection = 'scm:git:https://github.com/melaya-labs/melaya.git'
            developerConnection = 'scm:git:ssh://git@github.com/melaya-labs/melaya.git'
        }
    }
}

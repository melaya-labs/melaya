[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melaya"
version = "0.2.0"
description = "Official SDK for Melaya Agent Builder and Mobile Device Control. Includes preview Melaya Trading namespaces that are not yet generally available."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Melaya" }]
keywords = [
    "melaya",
    "ai-agents",
    "device-control",
    "agent-builder",
    "agentic-ai",
    "mobile-agents",
    "hitl",
    "pipelines",
    "agents",
    "sdk",
    "trading",
    "market-data",
    "websocket",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
stream = ["websockets>=12"]
dev = ["mypy>=1.8", "ruff>=0.16.0", "pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://melaya.org"
Documentation = "https://melaya.org/docs"
Repository = "https://github.com/melaya-labs/melaya"
Issues = "https://github.com/melaya-labs/melaya/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/melaya"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120

[package]
name = "melaya"
version = "0.2.0"
edition = "2021"
description = "Official SDK for Melaya Agent Builder and Mobile Device Control. Includes preview Melaya Trading namespaces that are not yet generally available."
license = "Apache-2.0"
repository = "https://github.com/melaya-labs/melaya"
homepage = "https://melaya.org"
documentation = "https://melaya.org/docs"
keywords = ["melaya", "ai-agents", "device-control", "agent-builder", "trading"]
categories = ["api-bindings", "web-programming"]

[lib]
name = "melaya"
path = "src/lib.rs"

[[example]]
name = "e2e"
path = "examples/e2e.rs"

[dependencies]
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"
tokio         = { version = "1",    features = ["full"] }
# tokio-tungstenite 0.24 re-exports rustls 0.23 via the Connector enum.
# rustls pulled directly so we can build an explicit ClientConfig with webpki roots.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util  = "0.3"
url           = "2"
thiserror     = "1"
# Must match the rustls that tokio-tungstenite 0.24 vendors (0.23.x).
rustls        = { version = "0.23", features = ["ring"] }
webpki-roots  = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# Publish every Melaya SDK on one version tag:
#   git tag v0.2.0 && git push origin v0.2.0   →   verify, then publish every registry
#   Java + Kotlin publish from independent jobs (maven-java, maven-kotlin). The nested Go
#   module receives its required packages/sdk-go/vX.Y.Z tag only after verification passes.
# NOTE: a Maven Central release is IMMUTABLE — the version you tag is final, no re-runs.
# If one registry job fails, re-run ONLY that job. pypi/nuget re-run cleanly (skip-existing).
# npm/crates/rubygems/maven hard-fail once a version is published — recover at the next patch version.
# NuGet uses Trusted Publishing (OIDC) — set the NUGET_USER secret to your nuget.org username.
# PHP/Packagist publishes from the repo-root composer.json (autoload -> packages/sdk-php/src) on each
# tag; .gitattributes export-ignore keeps the download PHP-only. Submit the repo to Packagist once.
# Secrets (Settings → Secrets → Actions): PYPI_TOKEN · CARGO_TOKEN · NUGET_USER · CENTRAL_USERNAME ·
# CENTRAL_PASSWORD · GPG_PRIVATE_KEY · GPG_PASSPHRASE  (npm + RubyGems use OIDC, no secret).
name: release
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC — npm Trusted Publishing, no token/secret needed
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@11.5.1      # Trusted Publishing needs npm >= 11.5.1
      - run: npm ci && npm run build
        working-directory: packages/sdk
      - run: npm publish --access public     # auto-uses OIDC + adds provenance
        working-directory: packages/sdk

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install build==1.5.0 twine==7.0.0
      - run: python -m build
        working-directory: packages/sdk-python
      - run: python -m twine upload --skip-existing dist/*
        working-directory: packages/sdk-python
        env: { TWINE_USERNAME: "__token__", TWINE_PASSWORD: "${{ secrets.PYPI_TOKEN }}" }

  crates:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: sudo apt-get update && sudo apt-get install -y nasm   # aws-lc-sys build dep
      - run: cargo publish --locked
        working-directory: packages/sdk-rust
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_TOKEN }}" }

  nuget:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC — NuGet Trusted Publishing (no stored API key)
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: "10.0.x" }     # csproj targets net10.0
      - uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}      # your nuget.org username (not email)
      - run: dotnet pack Melaya -c Release -o out
        working-directory: packages/sdk-csharp
      - run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: packages/sdk-csharp
        env:
          NUGET_API_KEY: "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"

  rubygems:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC — RubyGems Trusted Publishing; uses your publisher policy, bypasses MFA
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with: { ruby-version: "3.3" }
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: |
          rm -f *.gem               # drop any stale gem so the push glob hits only the fresh build
          gem build *.gemspec
          gem push *.gem
        working-directory: packages/sdk-ruby

  maven-java:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with: { gradle-version: "8.10.2" }
      - name: Publish Java SDK to Maven Central
        run: gradle publishToMavenCentral --no-configuration-cache -PmavenCentralAutomaticPublishing=true
        working-directory: packages/sdk-java
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: "${{ secrets.CENTRAL_USERNAME }}"
          ORG_GRADLE_PROJECT_mavenCentralPassword: "${{ secrets.CENTRAL_PASSWORD }}"
          ORG_GRADLE_PROJECT_signingInMemoryKey: "${{ secrets.GPG_PRIVATE_KEY }}"
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: "${{ secrets.GPG_PASSPHRASE }}"

  maven-kotlin:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with: { gradle-version: "8.10.2" }
      - name: Publish Kotlin SDK to Maven Central
        run: gradle publishToMavenCentral --no-configuration-cache -PmavenCentralAutomaticPublishing=true
        working-directory: packages/sdk-kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: "${{ secrets.CENTRAL_USERNAME }}"
          ORG_GRADLE_PROJECT_mavenCentralPassword: "${{ secrets.CENTRAL_PASSWORD }}"
          ORG_GRADLE_PROJECT_signingInMemoryKey: "${{ secrets.GPG_PRIVATE_KEY }}"
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: "${{ secrets.GPG_PASSPHRASE }}"

  go-tag:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push the Go submodule tag back to this repo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - name: Tag the Go module (subdir modules need a path-prefixed tag)
        run: |
          V="${GITHUB_REF_NAME}"                 # vX.Y.Z
          TAG="packages/sdk-go/${V}"             # module is at packages/sdk-go/
          WANT="$(git rev-parse "${V}^{commit}")"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            HAVE="$(git rev-parse "${TAG}^{commit}")"
            if [ "$HAVE" = "$WANT" ]; then
              echo "Tag ${TAG} already points at ${WANT} — nothing to do (safe re-run)."
              exit 0
            fi
            echo "Tag ${TAG} exists but points at ${HAVE}, expected ${WANT}. Refusing to move it." >&2
            exit 1
          fi
          git tag "$TAG" "$V"
          git push origin "$TAG"

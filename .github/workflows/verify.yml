name: sdk-verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check-release.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
        working-directory: packages/sdk
      - run: npm run build
        working-directory: packages/sdk
      - run: npm pack --dry-run
        working-directory: packages/sdk

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.5.0 twine==6.2.0
      - run: python -m compileall -q src
        working-directory: packages/sdk-python
      - run: python -m build
        working-directory: packages/sdk-python
      - run: python -m twine check dist/*
        working-directory: packages/sdk-python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: packages/sdk-go/go.sum
      - run: go mod verify
        working-directory: packages/sdk-go
      - run: go test ./...
        working-directory: packages/sdk-go
      - run: go vet ./...
        working-directory: packages/sdk-go

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: packages/sdk-rust
      - run: cargo test --all-targets
        working-directory: packages/sdk-rust
      - run: cargo package --locked
        working-directory: packages/sdk-rust

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.10.2"
      - run: gradle clean build generatePomFileForMavenPublication --no-daemon
        working-directory: packages/sdk-java
      - name: Reject bundled third-party classes
        run: |
          JAR=$(ls build/libs/melaya-sdk-*.jar | grep -vE -- '-(sources|javadoc)\.jar$')
          if jar tf "$JAR" | grep -Eq '^(com/fasterxml/jackson|org/java_websocket)/'; then
            echo "Published Java library JAR contains unrelocated dependency classes" >&2
            exit 1
          fi
          jar tf "$JAR" | grep -q '^META-INF/LICENSE$'
        working-directory: packages/sdk-java

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.10.2"
      - run: gradle clean build generatePomFileForMavenPublication --no-daemon
        working-directory: packages/sdk-kotlin
      - run: jar tf "$(ls build/libs/melaya-sdk-kotlin-*.jar | grep -vE -- '-(sources|javadoc)\.jar$')" | grep -q '^META-INF/LICENSE$'
        working-directory: packages/sdk-kotlin

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Melaya.sln -c Release
        working-directory: packages/sdk-csharp
      - run: dotnet pack Melaya/Melaya.csproj -c Release -o out --no-build
        working-directory: packages/sdk-csharp

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: composer validate --strict composer.json
      - run: composer validate --strict packages/sdk-php/composer.json
      - name: Verify Packagist archive surface
        run: |
          git archive --format=tar HEAD | tar -tf - > /tmp/melaya-php-files.txt
          grep -qx 'composer.json' /tmp/melaya-php-files.txt
          grep -qx 'LICENSE' /tmp/melaya-php-files.txt
          grep -qx 'packages/sdk-php/src/Melaya.php' /tmp/melaya-php-files.txt
          if grep -Eq '^packages/(sdk|sdk-python|sdk-go|sdk-rust|sdk-java|sdk-kotlin|sdk-csharp|sdk-ruby)/' /tmp/melaya-php-files.txt; then
            echo 'Packagist archive contains a non-PHP SDK' >&2
            exit 1
          fi
          if grep -Eq '^(\.github|assets|benchmarks|data|docs|examples|scripts)/' /tmp/melaya-php-files.txt; then
            echo 'Packagist archive contains repository-only material' >&2
            exit 1
          fi
      - name: PHP syntax
        run: find packages/sdk-php/src -name '*.php' -print0 | xargs -0 -n1 php -l

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: "3.3"
      - name: Ruby syntax
        run: find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c
        working-directory: packages/sdk-ruby
      - run: gem build melaya.gemspec
        working-directory: packages/sdk-ruby
